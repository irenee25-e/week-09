<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portofolio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f8f9fa; /* Latar abu-abu muda terang seperti Foto 1 */
      color: #333333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: #0f152a;
      color: #ffffff;
      padding: 16px 24px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    main {
      flex: 1;
      padding: 24px 16px;
    }

    .flex-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      width: 280px; /* Ukuran lebar kotak pas */
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .card p {
      padding: 12px 14px;
      font-size: 0.85rem;
      line-height: 1.4;
      color: #475569;
    }

    footer {
      background-color: #ffffff;
      color: #666666;
      padding: 12px 24px;
      text-align: center;
      font-size: 0.85rem;
      border-top: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>

  <header>
    <h1>Portofolio Foto Irene</h1>
  </header>

  <main>
    <div class="flex-container">
      <div class="card">
        <img src="karyaku/bangunan.warna.jpg" alt="Foto bangunan">
        <p>Foto hasil bangunan</p>
      </div>

      <div class="card">
        <img src="karyaku/dokumen.radio.jpg" alt="Foto dokumen kunjungan">
        <p>Foto hasil dokumen</p>
      </div>

      <div class="card">
        <img src="karyaku/foto.bunga.jpg" alt="Foto bunga">
        <p>Hasil foto bunga</p>
      </div>

      <div class="card">
        <img src="karyaku/foto.kasur.jpg" alt="Foto kasur gelap">
        <p>Hasil foto kasur</p>
      </div>

      <div class="card">
        <img src="karyaku/foto.lukisan.jpg" alt="Foto lukisan bagus">
        <p>Hasil foto lukisan</p>
      </div>

      <div class="card">
        <img src="karyaku/foto.merah.jpg" alt="Foto lukisan digital">
        <p>Hasil foto merah</p>
      </div>

      <div class="card">
        <img src="karyaku/foto.orang.jpg" alt="Foto katherin">
        <p>Hasil foto orang</p>
      </div>

      <div class="card">
        <img src="karyaku/foto.pajang.jpg" alt="Foto pajagan foto">
        <p>Hasil foto pajangan</p>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; Irene Gallery</p>
  </footer>

</body>
</html>
